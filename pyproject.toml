[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astra"
version = "1.0.0.dev0"
description = "Astra 数字团队平台"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2", "aiosqlite>=0.20,<1", "asyncmy>=0.2.9,<1",
  "celery[redis]>=5.4,<6", "cryptography>=43,<51", "fastapi>=0.115,<1",
  "greenlet>=3.2,<4", "mcp>=2.1,<3", "httpx>=0.27,<1", "paramiko>=3.4,<4", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.30,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]
[tool.hatch.build.targets.wheel]
packages = ["apps", "domains", "agents"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/v1"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
