name: Build Workspace UI 1.2.27

on:
  workflow_dispatch:
  push:
    branches:
      - feat/versioned-workspace-ui
    paths:
      - web/workspace-ui/versions/1.2.27/**
      - .github/workflows/workspace-ui-1.2.27.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Astra
        uses: actions/checkout@v4
        with:
          ref: feat/versioned-workspace-ui

      - name: Checkout OpenCode v1.2.27
        uses: actions/checkout@v4
        with:
          repository: linxuyiyi/opencode-self
          ref: v1.2.27
          path: .build/opencode-1.2.27

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Apply Astra embedding patches
        run: |
          python web/workspace-ui/versions/1.2.27/patch_upstream.py .build/opencode-1.2.27
          cp -R web/workspace-ui/versions/1.2.27/app .build/opencode-1.2.27/packages/astra-workspace

      - name: Install and build
        working-directory: .build/opencode-1.2.27
        run: |
          bun install
          bun run --cwd packages/astra-workspace build

      - name: Publish versioned static bundle
        run: |
          rm -rf web/nexus/public/opencode-workspace/1.2.27
          mkdir -p web/nexus/public/opencode-workspace/1.2.27
          cp -R .build/opencode-1.2.27/packages/astra-workspace/dist/. web/nexus/public/opencode-workspace/1.2.27/
          test -f web/nexus/public/opencode-workspace/1.2.27/index.html

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/nexus/public/opencode-workspace/1.2.27
          if git diff --cached --quiet; then
            echo "Workspace UI 1.2.27 bundle unchanged"
            exit 0
          fi
          git commit -m "chore(workspace): build OpenCode 1.2.27 UI [skip ci]"
          git push origin HEAD:feat/versioned-workspace-ui
