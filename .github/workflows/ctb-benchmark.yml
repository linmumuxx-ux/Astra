name: CTB Benchmark

on:
  workflow_dispatch:

jobs:
  traffic-light:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ctb/benchmark/traffic_light
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate public workspace isolation
        run: |
          python ../../tools/prepare_public_workspace.py . "$RUNNER_TEMP/ctb-traffic-public"
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'ctb-traffic-public'
          files = sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file())
          expected = ['problem.md', 'test_aw.py', 'test_submission.py']
          if files != expected:
              raise SystemExit('unexpected public workspace files: %r' % files)
          PY

      - name: Validate testcase on correct implementation
        run: python run_correct.py

      - name: Validate hidden mutants
        run: python hidden/validate_mutants.py

      - name: Evaluate hidden mutants
        run: |
          python hidden/evaluate.py > benchmark_result.json
          cat benchmark_result.json

      - name: Build score summary
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import unittest
          from pathlib import Path

          data = json.loads(Path('benchmark_result.json').read_text(encoding='utf-8'))

          spec = importlib.util.spec_from_file_location('ctb_submission', 'test_submission.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          case_cls = getattr(module, 'TestTrafficController')
          testcase_count = unittest.defaultTestLoader.loadTestsFromTestCase(case_cls).countTestCases()

          killed = data['killed_count']
          summary = {
              'total_bugs': data['total'],
              'killed_bugs': killed,
              'kill_rate': round(killed / data['total'] * 100, 2) if data['total'] else 0,
              'testcase_count': testcase_count,
              'kills_per_testcase': round(killed / testcase_count, 3) if testcase_count else 0,
              'hit_bug_ids': data['hit_bug_ids'],
              'missed_bug_ids': data['missed_bug_ids'],
              'testcase_hits': data['testcase_hits'],
              'errors': data.get('errors', {}),
          }
          Path('benchmark_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          with open(Path.home() / 'summary.md', 'w', encoding='utf-8') as f:
              f.write('# CTB Traffic Light Benchmark\n\n')
              f.write(f"- Hidden bugs: {summary['total_bugs']}\n")
              f.write(f"- Killed: {summary['killed_bugs']}\n")
              f.write(f"- Kill rate: {summary['kill_rate']:.2f}%\n")
              f.write(f"- Testcases: {summary['testcase_count']}\n")
              f.write(f"- Kills/testcase: {summary['kills_per_testcase']:.3f}\n")
              f.write(f"- Hit: {summary['hit_bug_ids']}\n")
              f.write(f"- Missed: {summary['missed_bug_ids']}\n")
          PY

      - name: Publish job summary
        run: cat "$HOME/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ctb-traffic-light-result
          path: |
            ctb/benchmark/traffic_light/benchmark_result.json
            ctb/benchmark/traffic_light/benchmark_summary.json
