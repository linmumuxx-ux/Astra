name: Nexus CI

on:
  push:
  pull_request:

jobs:
  task-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install task platform
        run: python -m pip install -e 'services/task-platform[dev]'
      - name: Lint, test, and migrate
        working-directory: services/task-platform
        run: |
          python -m ruff check app tests
          python -m pytest
          python -m alembic upgrade head

  nexus-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Nexus API
        run: python -m pip install -r services/nexus-api/requirements-dev.txt
      - name: Test
        run: PYTHONPATH=services/nexus-api python -m pytest services/nexus-api/tests

  agent-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and import Agent Service
        run: |
          python -m pip install -r services/agent-service/requirements.txt
          PYTHONPATH=services/agent-service python -c 'import agent_service'

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/nexus/package-lock.json
      - name: Type-check and build
        working-directory: web/nexus
        run: |
          npm ci
          npm run type-check
          npm run build
