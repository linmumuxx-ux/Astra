employees:
  - id: astra-01
    name: Astra-01
    role: 测试平台开发
    description: 负责测试平台问题和需求处理
    enabled: true
    task_types:
      - ISSUE
      - REQUIREMENT
    category_ids:
      - testing-platform
      - automation-engineering
    execution_environment:
      mode: LOCAL
      name: 本地 Agent
      opencode_path: opencode
      model_name: null  # 默认继承 ASTRA_OPENCODE_MODEL；员工需要特殊模型时再覆盖
      workspace_root: ./workspaces/astra-01
    policy:
      auto_claim: true
      auto_execute: true
      max_auto_retries: 3
